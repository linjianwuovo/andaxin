[versions]
# 工具链跟本机已验证可用的一套对齐（AGP/Gradle/Kotlin/SDK），不是照抄旧仓，是这台机器上唯一编得过的一组。
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.03.00"
activity-compose = "1.13.0"
lifecycle = "2.10.0"
core-ktx = "1.18.0"
nav-compose = "2.9.7"
datastore = "1.1.1"
okhttp = "4.12.0"
serialization-json = "1.9.0"
coil = "3.0.4"
# ios 分支的外观底座：iOS 27 液态玻璃复刻框架（Apache-2.0，minSdk 33）
glasmio = "0.1.2"
camerax = "1.5.0-alpha06"
mlkit-barcode = "17.3.0"
# 并进来的 music 模块要的：Hilt 注解处理与 KSP
hilt = "2.60.1"
ksp = "2.3.12"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "nav-compose" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization-json" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# 宿主 @HiltAndroidApp 自己也要跑一遍注解处理：music 模块里的 @AndroidEntryPoint
# 是挂在宿主的 Application 上生成组件的，只靠库模块的 ksp 拼不出最终图。
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }


# ios 分支：六模块引最高层的四个,core/glass 传递带出 icons
glasmio-core = { group = "io.github.neoruaa.glasmio", name = "glasmio-core", version.ref = "glasmio" }
glasmio-glass = { group = "io.github.neoruaa.glasmio", name = "glasmio-glass", version.ref = "glasmio" }
glasmio-ui = { group = "io.github.neoruaa.glasmio", name = "glasmio-ui", version.ref = "glasmio" }
glasmio-scaffold = { group = "io.github.neoruaa.glasmio", name = "glasmio-scaffold", version.ref = "glasmio" }

# 扫码签到：CameraX 出帧 + ML Kit 识码，不接任何厂商扫码 SDK
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit-barcode" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }